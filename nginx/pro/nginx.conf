user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # FastCGI Cache Settings
    fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=wordpress:100m max_size=1g inactive=60m use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

    # Cache zones
    proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=assets:100m max_size=1g inactive=60m use_temp_path=off;

    # Trusted IPs
    set_real_ip_from  172.0.0.0/8; 
    set_real_ip_from  192.0.0.0/8;
    set_real_ip_from  10.0.0.0/8;

    # Header IP
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 500;
    types_hash_max_size 2048;

    # Rate limiting por endpoint
    limit_req_zone $binary_remote_addr zone=bot:10m rate=10r/s;     # Pasa de 30r/m a 10r/s
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=xmlrpc:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=ajax:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=rest:10m rate=10r/s;
    
    # Límite de conexiones
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Bloquear User-Agents de bots maliciosos
    map $http_user_agent $bad_bot {
        default 0;
        ~*(curl|wget|python-requests|Go-http|ruby|scrapy|masscan|zgrab) 1;
    }

    # Rutas servidas a máquinas (MCP, catálogo AI y consumidores del podcast):
    # exentas del bloqueo por User-Agent. El feed de podcast lo consume una
    # máquina (un validador de directorios, un reproductor o un indexador) y el
    # cierre de conexión es, para ella, indistinguible de «el feed no existe».
    # La transcripción SRT vive en /wp-content/uploads/, que no figura entre las
    # extensiones estáticas del servidor, y el bloqueo se declara a nivel de
    # server (wp.conf), así que alcanza también a los estáticos; por eso se exime
    # SOLO la ruta de los .srt, nunca el directorio de subidas entero.
    map $request_uri $mcp_machine_path {
        default 0;
        ~^/mcp(/|\?|$)                           1;
        ~^/\.well-known/ai-catalog\.json(\?|$)   1;
        ~^/\.well-known/ard\.json(\?|$)          1;
        ~^/\.well-known/mcp-registry-auth(\?|$)            1;
        ~^/\.well-known/oauth-protected-resource(\?|$)     1;
        ~^/wp-json/atareao/v1/mcp(/|\?|$)       1;
        ~^/podcast/feed(/|\?|$)                  1;
        ~^/wp-content/uploads/.*\.srt$           1;
    }

    # El bloqueo de bots se mantiene, salvo en las rutas anteriores
    map "$bad_bot:$mcp_machine_path" $bad_bot_blocked {
        default 0;
        "1:0"   1;
    }

    # Endpoint del transporte (único donde se admite OPTIONS: preflight CORS)
    map $request_uri $mcp_endpoint {
        default 0;
        ~^/mcp/?(\?|$)  1;
        ~^/wp-json/atareao/v1/mcp/?(\?|$)  1;
    }

    # Métodos: OPTIONS solo en /mcp; el resto sigue bloqueado como hasta ahora
    map "$request_method:$mcp_endpoint" $method_blocked {
        default 0;
        ~^OPTIONS:0$                    1;
        ~^(?!(GET|POST|HEAD|OPTIONS):)  1;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}
