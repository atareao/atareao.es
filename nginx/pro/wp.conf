# 1. Definición de exclusión de caché
map "$request_uri:$http_cookie" $skip_cache {
    default 0;
    "~*/wp-admin/" 1;
    "~*/wp-login.php" 1;
    "~*/wp-cron.php" 1;
    "~*/xmlrpc.php" 1;
    "~*\.(xml|txt)$" 1;
    "~*comment_author" 1;
    "~*wordpress_[a-f0-9]+" 1;
    "~*wp-postpass" 1;
    "~*wordpress_no_cache" 1;
    "~*wordpress_logged_in" 1;
    "~*/feed/" 1;
    "~*/contactar" 1;
}

map $http_x_cache_purge $purge_active {
    default "";
    include /etc/nginx/conf.d/purge-secret/*.map;
}

server {
    listen 80;
    server_name atareao.es;
    root /var/www/html;
    index index.php index.html index.htm;

    limit_conn conn 20;

    real_ip_header X-Forwarded-For;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://atareao.es https://umami.atareao.es; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://atareao.es; connect-src 'self' https://umami.atareao.es; img-src 'self' data: https://atareao.es https://secure.gravatar.com; worker-src 'self' blob:; frame-src 'self' https: blob:;" always;

    if ($method_blocked) {
        return 444;
    }

    add_header X-Cache-Status $upstream_cache_status always;

    set $skip_cache 0;

    if ($request_method = POST) {
        set $skip_cache 1;
    }
    if ($query_string != "") {
        set $skip_cache 1;
    }

    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|index.php|sitemap(_index)?.xml") {
        set $skip_cache 1;
    }

    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    if ($bad_bot_blocked) {
        return 444;
    }

    # Bloqueo estricto de escaneos y ejecuciones PHP no autorizadas en uploads
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Bloqueo exacto de scripts PHP atacados comúnmente (Evita que lleguen al procesador PHP)
    location ~* ^/(wp-load|wp-links-opml|wp-trackback|wp-mail|readme|license|wp-config-sample)\.php$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location = /xmlrpc.php {
        limit_req zone=xmlrpc burst=2 nodelay;
        access_log off;
        log_not_found off;
        return 444;
    }

    # Proteger wp-login.php específicamente
    location = /wp-login.php {
        limit_req zone=login burst=5 delay=3;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
	
	# Pocket Id
	fastcgi_buffering on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # Rutas estáticas de WordPress
    location / {
        # burst más holgado y con delay para evitar cortar a usuarios reales
        limit_req zone=bot burst=40 delay=20;
        try_files $uri $uri/ /index.php?$args;
    }

    # Procesamiento general PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass wordpress:9000;

        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REMOTE_ADDR $remote_addr;

        fastcgi_cache wordpress;
        fastcgi_cache_bypass $skip_cache$purge_active;
        fastcgi_no_cache $skip_cache;

        fastcgi_cache_valid 200 301 302 6h;
        fastcgi_cache_valid 404 1m;

        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;

        fastcgi_buffering on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
        try_files $uri @production_images;
    }

    location @production_images {
        proxy_pass https://atareao.es;
        proxy_set_header Host atareao.es;
        proxy_ssl_server_name on;
        proxy_cache assets;
        proxy_cache_valid 200 7d;
        add_header X-Image-Source "production" always;
        proxy_buffer_size       8k;
        proxy_buffers           8 8k;
        proxy_busy_buffers_size 16k;
    }

    location ~* \.(css|js|woff2?|eot|ttf|otf)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    # Ocultar archivos ocultos y configuración sensible
    location ~ /\.(?!well-known) { deny all; }
    location ~ /(wp-config.php|readme.html|license.txt) { deny all; }
    location ~* /(\.env|\.git|secrets\.|key\.json|rclone\.conf|Dockerfile|docker-compose) {
        access_log off;
        return 444;
    }
}
