# Referencias inmutables: las acciones de terceros se fijan a un SHA de commit.
# Consulta la política de actualización en `.github/workflows/release-prepare.yml`.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Theme and Plugin zips
        run: |
          # --- Empaquetar el TEMA ---
          cd wp-content/themes
          zip -r ../../atareao-theme.zip atareao-theme -x "*.git*" "node_modules/*" ".DS_Store"
          cd ../..

          # --- Empaquetar el PLUGIN ---
          cd wp-content/plugins
          zip -r ../../atareao-functionality.zip atareao-functionality -x "*.git*" "node_modules/*" ".DS_Store"
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            atareao-theme.zip
            atareao-functionality.zip
          generate_release_notes: true
