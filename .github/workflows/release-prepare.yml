name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release') && !contains(github.event.head_commit.message, 'release/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::error::Falta el secreto GH_PAT. El pipeline lo necesita porque el push del tag vX.Y.Z debe encadenar release.yml y el token por defecto de Actions no dispara workflows. Crea un PAT con permisos 'Contents: read/write' y 'Pull requests: read/write' y guárdalo con: gh secret set GH_PAT"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_PAT}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" || true)
          echo "Comprobación de GH_PAT: HTTP ${code:-000}"
          case "${code}" in
            200) echo "GH_PAT válido (HTTP 200)." ;;
            401) echo "::error::GH_PAT no autentica (HTTP 401): token inválido o revocado. Regenera el PAT y ejecútalo de nuevo con: gh secret set GH_PAT"; exit 1 ;;
            404) echo "::error::GH_PAT no tiene acceso al repositorio ${GITHUB_REPOSITORY} (HTTP 404). Revisa el acceso del token y ejecuta: gh secret set GH_PAT"; exit 1 ;;
            *)   echo "::error::No se pudo validar GH_PAT (HTTP ${code:-000}). Comprueba la conectividad con api.github.com y vuelve a intentarlo."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      - name: Determine bump type from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s")
          if echo "$COMMITS" | grep -q -E "(BREAKING CHANGE|!:|💥)"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -q -E "(^feat|^[^\w]*feat)"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with vampus
        run: |
          vampus upgrade ${{ steps.bump.outputs.type }}
          NEW_VER=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          sed -i "s/Version: .*/Version: $NEW_VER/" wp-content/plugins/atareao-functionality/atareao-functionality.php

      - name: Get new version
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Create release branch, tag and PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit del release en una rama temporal, nunca en main directamente
          # (main y development tienen enforce_admins: true, el push directo fallaría).
          git checkout -b "release/v${V}"
          git add -A
          git commit -m "chore: release v${V}"
          # Push SOLO de la rama temporal (no main)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "release/v${V}"
          # El tag dispara release.yml (build + publish).
          # Usar GH_PAT para que el push del tag encadene el workflow.
          git tag "v${V}"
          git push origin "v${V}"
          # PR release/v${V} -> main
          BODY='Release automático v'"${V}"' generado por `release-prepare.yml`.

          El changelog (`CHANGELOG.md`) y los version bumps (`.vampus.yml` y header del plugin) están incluidos en esta rama. Al mergear, el pipeline de publicación (`release.yml`) completa el release.'
          gh pr create \
            --base main \
            --head "release/v${V}" \
            --title "chore: release v${V}" \
            --body "$BODY" || {
            echo "::error::No se pudo crear el PR release/v${V} -> main. Revisa que el workflow declare 'pull-requests: write' y que GH_PAT tenga permisos de creación de PR." >&2
            exit 1
          }
          echo "✅ PR creado: release/v${V} -> main"

  sync-development:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::error::Falta el secreto GH_PAT. El pipeline lo necesita porque el push del tag vX.Y.Z debe encadenar release.yml y el token por defecto de Actions no dispara workflows. Crea un PAT con permisos 'Contents: read/write' y 'Pull requests: read/write' y guárdalo con: gh secret set GH_PAT"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_PAT}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" || true)
          echo "Comprobación de GH_PAT: HTTP ${code:-000}"
          case "${code}" in
            200) echo "GH_PAT válido (HTTP 200)." ;;
            401) echo "::error::GH_PAT no autentica (HTTP 401): token inválido o revocado. Regenera el PAT y ejecútalo de nuevo con: gh secret set GH_PAT"; exit 1 ;;
            404) echo "::error::GH_PAT no tiene acceso al repositorio ${GITHUB_REPOSITORY} (HTTP 404). Revisa el acceso del token y ejecuta: gh secret set GH_PAT"; exit 1 ;;
            *)   echo "::error::No se pudo validar GH_PAT (HTTP ${code:-000}). Comprueba la conectividad con api.github.com y vuelve a intentarlo."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Sync development with main via PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin development
          # Si los árboles son idénticos no hay nada que sincronizar.
          if git diff --quiet origin/main origin/development; then
            echo "✅ development ya está sincronizado con main"
            exit 0
          fi
          # Rama temporal única por SHA; merge --no-ff de main en development.
          # Si hay conflictos, el job falla con el mensaje de git y se resuelven
          # manualmente en development (mejor que perder trabajo con un force push).
          BRANCH="chore/sync-development-${GITHUB_SHA:0:7}"
          git checkout -b "$BRANCH" origin/development
          git merge origin/main --no-ff -m "🔀 merge: sync development with main"
          git push origin "$BRANCH"
          # Solo se pushea la rama temporal; la integración en development es vía PR.
          BODY='Sincronización automática post-release de `main` hacia `development`.

          Si este PR no se puede mergear por conflictos, resuélvelos en `development` manualmente y mergea después.'
          gh pr create \
            --base development \
            --head "$BRANCH" \
            --title "chore: sync development with main" \
            --body "$BODY" || {
            echo "::error::No se pudo crear el PR de sync \"$BRANCH\" -> development. Revisa que el workflow declare 'pull-requests: write' y que GH_PAT tenga permisos de creación de PR." >&2
            exit 1
          }
          echo "✅ PR de sync creado: $BRANCH -> development"