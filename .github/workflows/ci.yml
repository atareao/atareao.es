# Referencias inmutables: las acciones de terceros se fijan a un SHA de commit.
# Consulta la política de actualización en `.github/workflows/release-prepare.yml`.
name: CI

on:
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'

      - name: PHP Lint
        run: |
          find wp-content/themes/atareao-theme wp-content/plugins/atareao-functionality -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Test release bump type detection
        run: bash .github/scripts/bump-type.test.sh
