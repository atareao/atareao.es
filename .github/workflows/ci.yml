# Referencias inmutables: las acciones de terceros se fijan a un SHA de commit.
# Consulta la política de actualización en `.github/workflows/release-prepare.yml`.
name: CI

on:
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'

      - name: PHP Lint
        run: |
          find wp-content/themes/atareao-theme wp-content/plugins/atareao-functionality -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      # Los arneses de `tests/` son PHP puro sobre `tests/wp-stubs.php` (dobles en
      # memoria: no requieren WordPress ni el contenedor `atareao-php-cli`), así que
      # se ejecutan aquí, en el job `lint`, sin `just` (no está en el runner) ni
      # Docker. Se cubre el arnés de valet, el guardián de coherencia de versión del
      # manifiesto MCP (`server.json` frente al plugin y a `.vampus.yml`), la paridad
      # del guid (emisión literal e importador del episodio ausente), los del feed
      # del podcast y los residuos de T10 (filtros reales de TSF, `itunes:explicit`
      # y autor canónico; este último incluye la guardia de hooks de TSF, que pasa
      # sin el plugin instalado). Ejecutar este paso en local:
      #   podman run --rm -v "$PWD:/workspace:Z" -w /workspace \
      #     --entrypoint php docker.io/library/php:8.3-cli \
      #     tests/t10-residuals/test_seo_tsf_integration.php
      - name: Test PHP harnesses
        run: |
          php tests/test-valet.php
          php tests/test-release-bump.php
          php tests/wp-cli/test_synopsis.php
          php tests/podcast-guid-parity/test_guid_emission.php
          php tests/podcast-guid-parity/test_import_missing.php
          php tests/podcast-feed-soberania/test_feed_complete.php
          php tests/podcast-feed-soberania/test_guid_mapping.php
          php tests/t10-residuals/test_seo_tsf_integration.php
          php tests/t10-residuals/test_feed_explicit.php
          php tests/t10-residuals/test_author_canonical.php
          php tests/podcast-duration/test_duration_emission.php
          php tests/podcast-duration/test_backfill.php
          php tests/podcast-duration/test_importer_degraded.php
          php tests/structured-data/test_person_sameas.php
          php tests/youtube-video-fallback/test_youtube_video.php
          php tests/youtube-video-fallback/test_backfill.php
          php tests/podcast-transcripts/test_attach.php
          php tests/podcast-transcripts/test_backfill.php

      # La suite Python (`tests/podcast-transcripts/*.py`) es el único guardián de
      # los oráculos que cazan las mutaciones M6/M12/M14/M15, así que se ejecuta en
      # CI junto a `ruff`. Solo usa la stdlib (no requiere WordPress ni Docker).
      # Equivale a `just test-transcripts` en local.
      - name: Install ruff
        run: pipx install ruff

      - name: Test Python harnesses
        run: python3 -m unittest discover -s tests/podcast-transcripts -v

      - name: Lint Python
        run: ruff check .

      - name: Test release bump type detection
        run: bash .github/scripts/bump-type.test.sh

      - name: Test release gate decision
        run: bash .github/scripts/release-needed.test.sh

      - name: Test prod deploy script
        run: bash scripts/deploy-to-prod.test.sh

      - name: Test feed cache config
        run: bash scripts/feed-cache-config.test.sh
